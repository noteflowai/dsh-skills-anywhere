name: Release

# Runs when a tag like v0.3.2 is pushed. Three jobs, each with the least
# privilege it needs:
#
#   release       check + pack, attach the tarball to a GitHub release
#   npm           publish the same tarball to npm with provenance
#   mcp-registry  register the release in the official MCP registry
#
# npm uses trusted publishing (OIDC) when the package has a trusted publisher
# configured on npmjs.com for this workflow file; NPM_TOKEN is only a fallback
# for the very first publish. The MCP registry accepts GitHub OIDC for the
# io.github.noteflowai/* namespace, so it needs no secret at all.
# See docs/RELEASING.md.

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
      - name: Check the tag matches every version file
        id: version
        run: |
          PKG=$(node -p "require('./package.json').version")
          test "v$PKG" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package.json v$PKG"; exit 1; }
          node scripts/sync-version.mjs --check
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
      - name: Pack tarball
        run: pnpm pack
      - name: Exercise the packed checker outside the checkout
        run: |
          CHECK_DIR="$(mktemp -d)"
          cd "$CHECK_DIR"
          npm init -y >/dev/null
          npm install --ignore-scripts "$GITHUB_WORKSPACE"/dsh-skills-anywhere-*.tgz >/dev/null
          node "$GITHUB_WORKSPACE/scripts/check-installed.mjs"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball
          path: dsh-skills-anywhere-*.tgz
          if-no-files-found: error
      - name: GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: dsh-skills-anywhere-*.tgz

  npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: release-tools
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Check the bundled npm supports trusted publishing (>= 11.5.1)
        # Node 24 ships npm 11.x; fail loudly instead of installing another npm over the network.
        run: |
          NPM_VERSION="$(npm --version)"
          echo "npm $NPM_VERSION"
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) { console.error(`npm ${process.argv[1]} is older than 11.5.1, which trusted publishing needs`); process.exit(1) }' "$NPM_VERSION"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball
      - name: Publish (trusted publishing when configured, NPM_TOKEN otherwise)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > ~/.npmrc
            echo "publishing with NPM_TOKEN"
          else
            echo "publishing with OIDC trusted publishing"
          fi
          npm publish ./dsh-skills-anywhere-*.tgz --access public --provenance
      - name: Verify
        run: |
          python3 release-tools/scripts/verify_npm_release.py ./dsh-skills-anywhere-*.tgz \
            --expected-version "${{ needs.release.outputs.version }}"

  mcp-registry:
    name: Publish to the MCP registry
    needs: [release, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned MCP publisher
        # Same version and digest as registry-recovery.yml; tests/workflows.test.ts
        # keeps them in step. The job holds an OIDC token, so never run `latest`.
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/mcp-publisher.tar.gz"
          (cd "$RUNNER_TEMP" && echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz' | sha256sum --check)
          tar xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" --help >/dev/null
      - name: Authenticate with GitHub OIDC
        run: '"$RUNNER_TEMP/mcp-publisher" login github-oidc'
      - name: Publish server.json
        run: '"$RUNNER_TEMP/mcp-publisher" publish'
