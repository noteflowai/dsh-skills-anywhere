# Bundle patch applied over the selected dsh profile when this package is listed
# in `dsh.profile.bundles` (that is what `dsh plugin add dsh-skills-anywhere` does).
#
# The plugin registers one extra provider on the built-in `ctx.skills` registry,
# so the shipped `@deepseek-ai/dsh-skill` / `dsh-skill-filesystem` / `dsh-tool-skill`
# rows stay untouched: the model keeps its usual `skill` tool and `/name`
# invocation, and simply sees more skills in the catalog.
#
# Override any field in your profile's own cordis.patch.yml by restating this
# row's `id` with a complete `config` block (a patch replaces, not merges).

- insert:
    - id: skills-anywhere
      name: dsh-skills-anywhere
      config:
        # Discover skills from the directories of other coding agents
        # (~/.claude/skills, .cursor/skills, ~/.codex/skills, ...).
        agents: true
        # Discover skills inside Claude Code plugin marketplaces
        # (~/.claude/plugins/marketplaces/*/plugins/*/skills/*).
        claudePlugins: true
        # Git repositories full of skills, synced into a local cache.
        # Add more here or with `npx dsh-skills-anywhere add owner/repo`.
        sources: []
        # At most this many skills from this provider enter the model's session
        # catalog (0 = unlimited). The rest stay user-invocable via /name and
        # reachable for the model through the find_skills / open_skill tools.
        catalog:
          limit: 50
          pin: []
          hide: []

    # Model-facing search + load tools for skills outside the catalog budget.
    # Needs the tool runtime (`ctx.tools`); in a profile without it this row
    # simply stays pending.
    - id: skills-anywhere-tools
      name: dsh-skills-anywhere/tools
      config:
        findLimit: 10
